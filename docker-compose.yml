version: '3.8'

services:
  trading-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trading_model_bot
    restart: unless-stopped
    volumes:
      # Mount code directory for live hot-reloading / development across OS
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - ENV=production
