name: Market Scanner Cron

on:
  schedule:
    # Runs every 30 minutes, Monday through Friday
    - cron: '*/30 * * * 1-5'
  workflow_dispatch: # This allows you to click a button to run it manually!

jobs:
  scan-markets:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # Caches dependencies so it runs much faster
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run Market Scanner
        env:
          # This pulls your email credentials securely from GitHub Secrets
          ENABLE_EMAIL_ALERTS: ${{ secrets.ENABLE_EMAIL_ALERTS }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: |
          python3 main.py --scan
